[package]
name = "rust-mon"
version = "0.0.1"
edition = "2021"
description = "RustMon: Server monitoring tool using prometheus metrics"
authors = ["https://github.com/electronicsleep"]

[dependencies]
reqwest = { version = "0.12", features = ["blocking", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
clap = { version = "4", features = ["derive"] }
gethostname = "^0.4"
chrono = "0.4"
log = "0.4"
env_logger = "0.11"
anyhow = "1"
